spring.application.name=demo

spring.datasource.url=jdbc:mysql://localhost:3306/restaurante
spring.datasource.username=root
spring.datasource.password=


spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
# a serializacao dos campos LAZY (bairro/tipo) depende disso estar ativo
spring.jpa.open-in-view=true

# dados da maquina (usuario do e-mail, pasta de uploads) ficam em application-local.properties
spring.config.import=optional:classpath:application-local.properties

#FOTOS
app.upload-dir=./uploads
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

#email (usuario e senha ficam em application-local.properties, que nao e versionado)
spring.mail.host=smtp.mailgun.org
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.debug=false

#seguranca (JWT). Segredo e admin inicial ficam em application-local.properties
# sem app.jwt.secret o app gera uma chave aleatoria (os tokens deixam de valer a cada reinicio)
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-minutes=120
# true = o cadastro aberto (/public/register) aceita role ADMIN, como no exemplo da atividade.
# ATENCAO: com true qualquer pessoa consegue se cadastrar como administrador. Use false em producao.
app.register.permitir-admin=true
app.admin.email=${ADMIN_EMAIL:}
app.admin.senha=${ADMIN_SENHA:}

#imobiliaria (usado nos e-mails "saber mais" e "entrar em contato")
# e-mail que RECEBE os contatos dos visitantes. No sandbox do Mailgun ele precisa estar em
# "Authorized Recipients". Defina em application-local.properties ou na variavel IMOBILIARIA_EMAIL.
app.imobiliaria.email=${IMOBILIARIA_EMAIL:}
# os acentos usam escapes unicode porque o Spring le arquivos .properties como ISO-8859-1
app.imobiliaria.nome=Imobili\u00e1ria Demo
app.imobiliaria.mensagem=Obrigado pelo seu interesse! Nossa equipe entrar\u00e1 em contato em breve para tirar suas d\u00favidas e agendar uma visita.

# origens do front-end liberadas (separe por virgula se tiver mais de uma)
app.cors.allowed-origins=http://localhost:3000
# endereco do front-end (usado no link do e-mail de contrato)
app.front-url=http://localhost:3000